<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Créer un compte - INFO_MARKET</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --bg: #060711;
            --purple: #8247ff;
            --purple-light: #b66cff;
            --text: #ffffff;
            --muted: #8e94aa;
            --border: rgba(255,255,255,.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: "Inter", sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(126,64,255,.20),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 10% 80%,
                    rgba(126,64,255,.08),
                    transparent 25%
                ),
                var(--bg);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 15px;
        }


        /* =========================
           BACKGROUND GLOW
        ========================= */

        .glow {
            position: fixed;

            width: 350px;
            height: 350px;

            border-radius: 50%;

            background: rgba(126,64,255,.12);

            filter: blur(100px);

            pointer-events: none;
        }

        .glow-one {
            top: -150px;
            left: -100px;
        }

        .glow-two {
            bottom: -150px;
            right: -100px;
        }


        /* =========================
           REGISTER CARD
        ========================= */

        .register-card {

            position: relative;

            z-index: 2;

            width: 100%;
            max-width: 460px;

            padding: 38px;

            background:
                linear-gradient(
                    145deg,
                    rgba(18,22,42,.97),
                    rgba(9,11,24,.97)
                );

            border:
                1px solid var(--border);

            border-radius: 24px;

            box-shadow:
                0 30px 90px
                rgba(0,0,0,.45);

            backdrop-filter: blur(20px);
        }


        /* =========================
           LOGO
        ========================= */

        .logo-icon {

            width: 48px;
            height: 48px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin: 0 auto 15px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #7740ff,
                    #b45fff
                );

            border-radius: 15px;

            font-size: 18px;

            font-weight: 800;

            box-shadow:
                0 0 30px
                rgba(139,77,255,.35);
        }

        .logo-title {

            margin: 0;

            font-size: 22px;

            font-weight: 800;

            letter-spacing: -.5px;
        }

        .logo-title span {
            color: var(--purple-light);
        }

        .welcome-text {

            margin-top: 8px;

            color: var(--muted);

            font-size: 9px;

            line-height: 1.7;
        }


        /* =========================
           FORM
        ========================= */

        form p {

            margin-bottom: 17px;

        }

        form p label {

            display: block;

            margin-bottom: 7px;
            margin-left: 4px;

            color: #aeb4c8;

            font-size: 9px;

            font-weight: 600;
        }

        form p input {

            display: block;

            width: 100%;

            padding: 13px 15px;

            color: white !important;

            background:
                rgba(255,255,255,.035) !important;

            border:
                1px solid
                rgba(255,255,255,.08) !important;

            border-radius: 11px;

            font-size: 10px;

            outline: none;

            box-shadow: none !important;

            transition: .2s;
        }

        form p input:focus {

            background:
                rgba(139,77,255,.05) !important;

            border-color:
                rgba(139,77,255,.65) !important;

            box-shadow:
                0 0 0 3px
                rgba(139,77,255,.08) !important;
        }


        /* =========================
           DJANGO HELP TEXT
        ========================= */

        form p span.helptext {

            display: block;

            margin-top: 6px;

            color: #626981;

            font-size: 7px;

            line-height: 1.6;
        }


        form p ul {

            margin-top: 7px;

            padding-left: 18px;

            color: #73798e;

            font-size: 7px;

            line-height: 1.7;
        }


        /* =========================
           ERRORS
        ========================= */

        .errorlist {

            margin: 5px 0 8px;

            padding-left: 16px;

            color: #ff7180;

            font-size: 8px;
        }


        /* =========================
           BUTTON
        ========================= */

        .register-btn {

            width: 100%;

            padding: 14px;

            margin-top: 5px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #7740ff,
                    #a85cff
                );

            border: none;

            border-radius: 11px;

            font-size: 10px;

            font-weight: 700;

            box-shadow:
                0 15px 35px
                rgba(139,77,255,.25);

            transition: .25s;
        }

        .register-btn:hover {

            color: white;

            transform:
                translateY(-2px);

            box-shadow:
                0 20px 45px
                rgba(139,77,255,.4);
        }


        /* =========================
           DIVIDER
        ========================= */

        .divider {

            height: 1px;

            margin: 27px 0;

            background:
                var(--border);
        }


        /* =========================
           LOGIN LINK
        ========================= */

        .login-text {

            margin: 0;

            color: var(--muted);

            font-size: 9px;

            text-align: center;
        }

        .login-link {

            display: inline-block;

            margin-top: 7px;

            color: var(--purple-light);

            font-size: 10px;

            font-weight: 700;
        }

        .login-link:hover {
            color: white;
        }


        /* =========================
           HOME
        ========================= */

        .home-link {

            display: block;

            margin-top: 20px;

            color: #73798e;

            text-align: center;

            font-size: 8px;

            transition: .2s;
        }

        .home-link:hover {
            color: white;
        }


        /* =========================
           SECURITY
        ========================= */

        .security {

            margin-top: 20px;

            color: #5f6579;

            text-align: center;

            font-size: 7px;
        }

        .security span {
            color: #43d69b;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 480px) {

            .register-card {
                padding: 28px 22px;
            }

            .logo-title {
                font-size: 20px;
            }

        }

    </style>

</head>


<body>


<!-- Background -->

<div class="glow glow-one"></div>
<div class="glow glow-two"></div>


<!-- REGISTER CARD -->

<div class="register-card">


    <!-- LOGO -->

    <div class="text-center">

        <div class="logo-icon">
            M
        </div>

        <h1 class="logo-title">
            INFO_<span>MARKET</span>
        </h1>

        <p class="welcome-text">
            Créez votre compte et commencez
            votre expérience avec INFO_MARKET.
        </p>

    </div>


    <!-- FORM -->

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}


        <button
            type="submit"
            class="register-btn"
        >

            ✨ Créer mon compte

        </button>

    </form>


    <!-- DIVIDER -->

    <div class="divider"></div>


    <!-- LOGIN -->

    <div class="text-center">

        <p class="login-text">
            Vous avez déjà un compte ?
        </p>

        <a
            href="{% url 'login' %}"
            class="login-link"
        >
            Se connecter →
        </a>

    </div>


    <!-- HOME -->

    <a
        href="{% url 'home' %}"
        class="home-link"
    >
        ← Retour à l'accueil
    </a>


    <!-- SECURITY -->

    <div class="security">

        <span>🔒</span>

        Vos informations sont protégées.

    </div>


</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

</body>

</html>
